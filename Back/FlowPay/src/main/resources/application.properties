spring.application.name=FlowPay
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DATABASE:flowpay}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
flowpay.rabbit.enabled=${FLOWPAY_RABBIT_ENABLED:true}
flowpay.distribuicao.scheduler.enabled=${FLOWPAY_DISTRIBUICAO_SCHEDULER_ENABLED:true}
flowpay.distribuicao.scheduler-delay-ms=${FLOWPAY_DISTRIBUICAO_SCHEDULER_DELAY_MS:5000}
flowpay.cors.allowed-origins=${FLOWPAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
flowpay.cors.allowed-origin-patterns=${FLOWPAY_CORS_ALLOWED_ORIGIN_PATTERNS:}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.api-docs.version=OPENAPI_3_0
