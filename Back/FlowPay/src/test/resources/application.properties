spring.datasource.url=${TEST_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowpay?currentSchema=flowpay_test}
spring.datasource.username=${TEST_SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${TEST_SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=flowpay_test
spring.flyway.schemas=flowpay_test
spring.flyway.create-schemas=true
flowpay.rabbit.enabled=false
flowpay.distribuicao.scheduler.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

